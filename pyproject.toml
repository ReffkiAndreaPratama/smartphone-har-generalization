[project]
name = "smartphone-har-generalization"
version = "1.0.0"
description = "Analisis generalisasi model HAR berbasis sensor smartphone pada perbedaan pengguna dan perangkat"
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
